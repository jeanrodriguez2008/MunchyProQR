<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MunchyProQR - Acceso / Registro</title>
    
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/img/icono.png">
    <link rel="apple-touch-icon" href="/static/img/icono.png">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-gray-100">
        <!-- Logo y Título -->
        <div class="p-6 text-center border-b border-gray-100 bg-white">
            <img src="/static/img/logo.png" alt="Alimentos Munchy" class="h-12 mx-auto mb-3 object-contain" onerror="this.style.display='none'">
            <h1 class="text-2xl font-bold text-gray-800">MunchyProQR</h1>
            <p class="text-xs text-gray-500 mt-1">Sistema de Control de Salidas de Producción</p>
        </div>

        <!-- Pestañas -->
        <div class="flex border-b text-sm font-semibold">
            <button id="tabLogin" onclick="mostrarTab('login')" class="flex-1 py-3 text-blue-600 border-b-2 border-blue-600 transition">
                Iniciar Sesión
            </button>
            <button id="tabRegister" onclick="mostrarTab('register')" class="flex-1 py-3 text-gray-500 hover:text-gray-700 transition">
                Registrarse
            </button>
            <button id="tabRecover" onclick="mostrarTab('recover')" class="flex-1 py-3 text-gray-500 hover:text-gray-700 transition">
                ¿Olvidó Clave?
            </button>
        </div>

        <!-- FORMULARIO 1: INICIAR SESIÓN -->
        <form id="formLogin" onsubmit="iniciarSesion(event)" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Usuario</label>
                <input type="text" id="login_username" required class="w-full p-3 border rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                <input type="password" id="login_password" required class="w-full p-3 border rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            <button type="submit" id="btnIngresar" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-md">
                Iniciar Sesión
            </button>
        </form>

        <!-- FORMULARIO 2: REGISTRO PÚBLICO -->
        <form id="formRegister" onsubmit="registrarUsuario(event)" class="p-6 space-y-3 hidden">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nombre Completo</label>
                <input type="text" id="reg_nombre" required class="w-full p-2.5 border rounded-xl bg-gray-50 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Usuario</label>
                <input type="text" id="reg_username" required class="w-full p-2.5 border rounded-xl bg-gray-50 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Correo Electrónico</label>
                <input type="email" id="reg_email" required class="w-full p-2.5 border rounded-xl bg-gray-50 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                <input type="password" id="reg_password" required class="w-full p-2.5 border rounded-xl bg-gray-50 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Pregunta Secreta</label>
                <input type="text" id="reg_pregunta" placeholder="Ej: ¿Mascota favorita?" required class="w-full p-2.5 border rounded-xl bg-gray-50 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Respuesta Secreta</label>
                <input type="password" id="reg_respuesta" required class="w-full p-2.5 border rounded-xl bg-gray-50 text-sm">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition shadow-md">
                Crear Cuenta
            </button>
        </form>

        <!-- FORMULARIO 3: RECUPERAR CLAVE -->
        <form id="formRecover" onsubmit="recuperarClave(event)" class="p-6 space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Usuario</label>
                <div class="flex gap-2">
                    <input type="text" id="rec_username" required class="flex-1 p-3 border rounded-xl bg-gray-50 text-sm">
                    <button type="button" onclick="consultarPregunta()" class="bg-gray-800 text-white px-3 rounded-xl font-bold text-xs">
                        Buscar
                    </button>
                </div>
            </div>
            <div id="divPregunta" class="hidden">
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Pregunta de Seguridad:</label>
                <p id="txtPregunta" class="p-3 bg-blue-50 text-blue-900 rounded-xl text-xs font-bold border border-blue-200 mb-3"></p>
                
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Respuesta Secreta</label>
                <input type="password" id="rec_respuesta" class="w-full p-3 border rounded-xl bg-gray-50 text-sm mb-3">

                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nueva Contraseña</label>
                <input type="password" id="rec_nueva_password" class="w-full p-3 border rounded-xl bg-gray-50 text-sm">
            </div>
            <button type="submit" id="btnRestablecer" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold hover:bg-purple-700 transition shadow-md hidden">
                Restablecer Contraseña
            </button>
        </form>
    </div>

    <script>
        function mostrarTab(tab) {
            document.getElementById('formLogin').classList.add('hidden');
            document.getElementById('formRegister').classList.add('hidden');
            document.getElementById('formRecover').classList.add('hidden');

            document.getElementById('tabLogin').className = "flex-1 py-3 text-gray-500 hover:text-gray-700 transition";
            document.getElementById('tabRegister').className = "flex-1 py-3 text-gray-500 hover:text-gray-700 transition";
            document.getElementById('tabRecover').className = "flex-1 py-3 text-gray-500 hover:text-gray-700 transition";

            if (tab === 'login') {
                document.getElementById('formLogin').classList.remove('hidden');
                document.getElementById('tabLogin').className = "flex-1 py-3 text-blue-600 border-b-2 border-blue-600 transition font-bold";
            } else if (tab === 'register') {
                document.getElementById('formRegister').classList.remove('hidden');
                document.getElementById('tabRegister').className = "flex-1 py-3 text-green-600 border-b-2 border-green-600 transition font-bold";
            } else {
                document.getElementById('formRecover').classList.remove('hidden');
                document.getElementById('tabRecover').className = "flex-1 py-3 text-purple-600 border-b-2 border-purple-600 transition font-bold";
            }
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            const btn = document.getElementById('btnIngresar');
            btn.disabled = true;
            btn.innerText = "Verificando...";

            const user = document.getElementById('login_username').value.trim();
            const pass = document.getElementById('login_password').value;

            const formData = new URLSearchParams();
            formData.append('username', user);
            formData.append('password', pass);

            try {
                const res = await fetch('/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('rol', data.rol.toLowerCase());

                    const userRol = data.rol.toLowerCase();
                    if (userRol === 'webmaster') {
                        window.location.href = '/webmaster-view';
                    } else if (userRol === 'coordinador' || userRol === 'almacenista' || userRol === 'consultor') {
                        window.location.href = '/dashboard-view';
                    } else {
                        window.location.href = '/scanner-view';
                    }
                } else {
                    const err = await res.json();
                    Swal.fire('Error', err.detail || 'Credenciales incorrectas', 'error');
                    btn.disabled = false;
                    btn.innerText = "Iniciar Sesión";
                }
            } catch (err) {
                Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error');
                btn.disabled = false;
                btn.innerText = "Iniciar Sesión";
            }
        }

        async function registrarUsuario(e) {
            e.preventDefault();
            const bodyData = {
                nombre_completo: document.getElementById('reg_nombre').value,
                username: document.getElementById('reg_username').value,
                email: document.getElementById('reg_email').value,
                password: document.getElementById('reg_password').value,
                pregunta_secreta: document.getElementById('reg_pregunta').value,
                respuesta_secreta: document.getElementById('reg_respuesta').value
            };

            try {
                const res = await fetch('/registro-publico', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    Swal.fire('¡Éxito!', 'Usuario registrado correctamente. Ya puedes iniciar sesión.', 'success');
                    mostrarTab('login');
                } else {
                    const err = await res.json();
                    Swal.fire('Atención', err.detail || 'Error al registrar', 'warning');
                }
            } catch (err) {
                Swal.fire('Error', 'Fallo de conexión.', 'error');
            }
        }

        async function consultarPregunta() {
            const user = document.getElementById('rec_username').value.trim();
            if (!user) {
                Swal.fire('Atención', 'Ingresa tu usuario.', 'warning');
                return;
            }

            try {
                const res = await fetch(`/api/usuarios/pregunta-secreta/${user}`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('txtPregunta').innerText = data.pregunta_secreta;
                    document.getElementById('divPregunta').classList.remove('hidden');
                    document.getElementById('btnRestablecer').classList.remove('hidden');
                } else {
                    Swal.fire('Error', 'Usuario no encontrado o sin pregunta configurada.', 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Error de conexión.', 'error');
            }
        }

        async function recuperarClave(e) {
            e.preventDefault();
            const bodyData = {
                username: document.getElementById('rec_username').value.trim(),
                respuesta_secreta: document.getElementById('rec_respuesta').value.trim(),
                nueva_password: document.getElementById('rec_nueva_password').value
            };

            try {
                const res = await fetch('/api/usuarios/recuperar-clave', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    Swal.fire('¡Éxito!', 'Contraseña restablecida. Inicia sesión con tu nueva clave.', 'success');
                    mostrarTab('login');
                } else {
                    const err = await res.json();
                    Swal.fire('Error', err.detail || 'Respuesta incorrecta.', 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Fallo de conexión.', 'error');
            }
        }
    </script>
</body>
</html>
