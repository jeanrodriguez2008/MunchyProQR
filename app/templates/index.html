<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MunchyProQR - Acceso / Registro</title>
    
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/img/icono.png">
    <link rel="apple-touch-icon" href="/static/img/icono.png">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border-t-4 border-blue-600">
        <div class="text-center mb-6">
            <img src="/static/img/logo.png" alt="Alimentos Munchy" class="h-16 mx-auto mb-3 object-contain" onerror="this.style.display='none'">
            <h1 class="text-2xl font-bold text-gray-800">MunchyProQR</h1>
            <p class="text-sm text-gray-500">Sistema de Control de Salidas de Producción</p>
        </div>

        <!-- Pestañas -->
        <div class="flex border-b mb-6 text-xs">
            <button id="tabLogin" onclick="mostrarTab('login')" class="w-1/3 py-2 font-bold border-b-2 border-blue-600 text-blue-600">Iniciar Sesión</button>
            <button id="tabRegistro" onclick="mostrarTab('registro')" class="w-1/3 py-2 font-bold text-gray-400 hover:text-gray-600">Registrarse</button>
            <button id="tabOlvido" onclick="mostrarTab('olvido')" class="w-1/3 py-2 font-bold text-gray-400 hover:text-gray-600">¿Olvidó Clave?</button>
        </div>

        <!-- Formulario Iniciar Sesión -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Usuario</label>
                <input type="text" id="username" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="password" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700 transition">
                Iniciar Sesión
            </button>
        </form>

        <!-- Formulario Registro Público con Pregunta Secreta -->
        <form id="registroForm" class="space-y-3 hidden">
            <div>
                <label class="block text-xs font-medium text-gray-700">Nombre Completo</label>
                <input type="text" id="reg_nombre" required class="w-full mt-1 p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700">Correo Electrónico</label>
                <input type="email" id="reg_email" required class="w-full mt-1 p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700">Nombre de Usuario</label>
                <input type="text" id="reg_username" required class="w-full mt-1 p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700">Contraseña</label>
                <input type="password" id="reg_password" required class="w-full mt-1 p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-indigo-700">Pregunta Secreta (Recuperación)</label>
                <input type="text" id="reg_pregunta" placeholder="Ej: ¿Nombre de mi primera mascota?" required class="w-full mt-1 p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-indigo-700">Respuesta Secreta</label>
                <input type="text" id="reg_respuesta" placeholder="Tu respuesta secreta..." required class="w-full mt-1 p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md font-semibold hover:bg-green-700 transition text-sm">
                Crear Mi Cuenta
            </button>
        </form>

        <!-- Formulario Recuperar Contraseña -->
        <form id="olvidoForm" class="space-y-3 hidden">
            <div>
                <label class="block text-xs font-medium text-gray-700">Ingresa tu Usuario</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="olvido_username" required class="w-full p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-purple-500">
                    <button type="button" onclick="buscarPregunta()" class="bg-purple-600 text-white px-3 py-1 rounded text-xs font-bold">Buscar</button>
                </div>
            </div>

            <div id="divPreguntaContainer" class="hidden space-y-3">
                <div class="bg-purple-50 p-3 rounded-md border border-purple-200">
                    <span class="text-xs text-purple-700 font-bold block">Pregunta de Seguridad:</span>
                    <p id="txtPreguntaSecreta" class="text-sm font-semibold text-gray-800 mt-1"></p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Tu Respuesta Secreta</label>
                    <input type="text" id="olvido_respuesta" required class="w-full mt-1 p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700">Nueva Contraseña</label>
                    <input type="password" id="olvido_nueva_password" required class="w-full mt-1 p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <button type="submit" class="w-full bg-purple-600 text-white py-2 rounded-md font-bold hover:bg-purple-700 transition text-sm">
                    Actualizar Contraseña
                </button>
            </div>
        </form>

        <div id="mensajeStatus" class="mt-4 text-center text-sm hidden p-2 rounded"></div>
    </div>

    <script>
        function mostrarTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registroForm = document.getElementById('registroForm');
            const olvidoForm = document.getElementById('olvidoForm');
            
            const tabLogin = document.getElementById('tabLogin');
            const tabRegistro = document.getElementById('tabRegistro');
            const tabOlvido = document.getElementById('tabOlvido');

            loginForm.classList.add('hidden');
            registroForm.classList.add('hidden');
            olvidoForm.classList.add('hidden');

            tabLogin.className = "w-1/3 py-2 font-bold text-gray-400 hover:text-gray-600";
            tabRegistro.className = "w-1/3 py-2 font-bold text-gray-400 hover:text-gray-600";
            tabOlvido.className = "w-1/3 py-2 font-bold text-gray-400 hover:text-gray-600";

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                tabLogin.className = "w-1/3 py-2 font-bold border-b-2 border-blue-600 text-blue-600";
            } else if (tab === 'registro') {
                registroForm.classList.remove('hidden');
                tabRegistro.className = "w-1/3 py-2 font-bold border-b-2 border-green-600 text-green-600";
            } else {
                olvidoForm.classList.remove('hidden');
                tabOlvido.className = "w-1/3 py-2 font-bold border-b-2 border-purple-600 text-purple-600";
            }
        }

        function mostrarMensaje(msg, esError = false) {
            const div = document.getElementById('mensajeStatus');
            div.innerText = msg;
            div.className = `mt-4 text-center text-sm p-2 rounded ${esError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            div.classList.remove('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('/token', { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Usuario o contraseña incorrectos');

                const data = await response.json();
                localStorage.clear();
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('rol', data.rol.toLowerCase());

                const rol = data.rol.toLowerCase();
                if (rol === 'webmaster') window.location.replace('/webmaster-view');
                else if (rol === 'coordinador') window.location.replace('/dashboard-view');
                else window.location.replace('/scanner-view');
            } catch (err) {
                mostrarMensaje(err.message, true);
            }
        });

        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bodyData = {
                nombre_completo: document.getElementById('reg_nombre').value,
                email: document.getElementById('reg_email').value,
                username: document.getElementById('reg_username').value,
                password: document.getElementById('reg_password').value,
                pregunta_secreta: document.getElementById('reg_pregunta').value,
                respuesta_secreta: document.getElementById('reg_respuesta').value
            };

            try {
                const res = await fetch('/registro-publico', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (!res.ok) {
                    const errorData = await res.json();
                    throw new Error(errorData.detail || 'Error en el registro');
                }

                mostrarMensaje('✅ Registro exitoso. Ya puedes iniciar sesión.');
                document.getElementById('registroForm').reset();
                setTimeout(() => mostrarTab('login'), 2000);
            } catch (err) {
                mostrarMensaje(err.message, true);
            }
        });

        async function buscarPregunta() {
            const user = document.getElementById('olvido_username').value;
            if (!user) return mostrarMensaje("Ingresa tu usuario", true);

            try {
                const res = await fetch(`/api/usuarios/pregunta-secreta/${user}`);
                if (!res.ok) throw new Error("Usuario no encontrado o no posee pregunta de seguridad");
                
                const data = await res.json();
                document.getElementById('txtPreguntaSecreta').innerText = data.pregunta_secreta;
                document.getElementById('divPreguntaContainer').classList.remove('hidden');
                mostrarMensaje("✅ Pregunta encontrada. Ingresa la respuesta.");
            } catch (err) {
                mostrarMensaje(err.message, true);
            }
        }

        document.getElementById('olvidoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bodyData = {
                username: document.getElementById('olvido_username').value,
                respuesta_secreta: document.getElementById('olvido_respuesta').value,
                nueva_password: document.getElementById('olvido_nueva_password').value
            };

            try {
                const res = await fetch('/api/usuarios/recuperar-clave', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Respuesta incorrecta");
                }

                mostrarMensaje("✅ ¡Contraseña actualizada! Ya puedes iniciar sesión.");
                document.getElementById('olvidoForm').reset();
                document.getElementById('divPreguntaContainer').classList.add('hidden');
                setTimeout(() => mostrarTab('login'), 2000);
            } catch (err) {
                mostrarMensaje(err.message, true);
            }
        });
    </script>
</body>
</html>
