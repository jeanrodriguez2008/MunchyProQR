<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MunchyProQR - Escáner de Producción</title>

    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/img/icono.png">
    <link rel="apple-touch-icon" href="/static/img/icono.png">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.replace('/');
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen p-3 md:p-6">

    <div class="max-w-2xl mx-auto space-y-4">
        <!-- Encabezado -->
        <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-3">
                <img src="/static/img/logo.png" alt="Alimentos Munchy" class="h-10 object-contain" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-base font-bold text-gray-800 leading-tight">Escáner QR Producción</h1>
                    <p class="text-[10px] text-gray-500" id="subtituloRol">MunchyProQR</p>
                </div>
            </div>
            <div class="flex gap-2">
                <a href="/dashboard-view" id="btnVerRegistro" class="hidden bg-indigo-50 text-indigo-700 px-3 py-2 rounded-xl text-xs font-bold hover:bg-indigo-100 transition flex items-center gap-1 border border-indigo-200">
                    📋 Ver Registro
                </a>
                <button onclick="cerrarSesion()" class="bg-red-50 text-red-600 px-3 py-2 rounded-xl text-xs font-bold hover:bg-red-100 transition border border-red-200">
                    Salir
                </button>
            </div>
        </div>

        <!-- Lector de Cámara QR -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
            <div id="reader" class="overflow-hidden rounded-xl bg-gray-900 mx-auto max-w-md min-h-[200px] flex items-center justify-center text-white text-xs">
                <span>Cámara Inactiva</span>
            </div>

            <div class="flex gap-2 mt-3">
                <button id="btnStartCam" onclick="iniciarCamara()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-xs hover:bg-blue-700 transition flex items-center justify-center gap-1">
                    ▶️ Iniciar Cámara
                </button>
                <button id="btnStopCam" onclick="detenerCamara()" disabled class="flex-1 bg-gray-300 text-gray-600 py-2.5 rounded-xl font-bold text-xs transition flex items-center justify-center gap-1">
                    ⏹️ Detener
                </button>
            </div>
        </div>

        <!-- Formulario de Datos del Ticket -->
        <form id="formSalida" onsubmit="procesarLectura(event)" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
            <h2 class="text-xs font-bold text-gray-700 uppercase flex items-center gap-1 border-b pb-2">
                📦 Datos del Ticket Escaneado
            </h2>

            <input type="hidden" id="codigo_qr">

            <div>
                <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Ticket N° (Recibo):</label>
                <input type="text" id="num_recibo" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs font-semibold text-gray-800 outline-none">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Código SKU:</label>
                    <input type="text" id="codigo_articulo" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs font-bold text-blue-600 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Cantidad (und):</label>
                    <input type="number" id="cantidad" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs font-bold text-green-700 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Descripción del Producto:</label>
                <input type="text" id="descripcion" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs font-medium text-gray-800 outline-none">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Lote:</label>
                    <input type="text" id="lote" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs text-gray-700 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-600 mb-0.5">F. Vencimiento:</label>
                    <input type="text" id="fecha_vencimiento" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs text-gray-700 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Turno:</label>
                    <input type="text" id="turno" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs text-gray-700 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Grupo:</label>
                    <input type="text" id="grupo" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs text-gray-700 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-600 mb-0.5">F. Recibo:</label>
                    <input type="text" id="fecha_recibo" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs text-gray-700 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-600 mb-0.5">F. Contabilización:</label>
                    <input type="text" id="fecha_contabilizacion" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs text-gray-700 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-600 mb-0.5">N° OP:</label>
                    <input type="text" id="num_op" readonly class="w-full p-2 border rounded-lg bg-gray-50 text-xs font-semibold text-indigo-600 outline-none">
                </div>
            </div>

            <button type="submit" id="btnGuardar" disabled class="w-full bg-gray-300 text-gray-500 py-3 rounded-xl font-bold text-xs transition shadow-sm cursor-not-allowed flex items-center justify-center gap-1 mt-2">
                ✅ Registrar Salida de Producción
            </button>
        </form>

        <!-- Listado de Escaneos Recientes -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-xs font-bold text-gray-700 uppercase mb-3 flex items-center gap-1">
                📋 ÚLTIMOS TICKETS Y ESTADO DE RECEPCIÓN
            </h2>
            <div id="listaUltimos" class="space-y-2 text-xs text-gray-500">
                <p class="text-center py-2">Cargando lista de tickets...</p>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const rol = (localStorage.getItem('rol') || 'analista').toLowerCase();
        let salidasCache = [];

        document.getElementById('subtituloRol').innerText = `MunchyProQR - Modo: ${rol.toUpperCase()}`;

        if (['webmaster', 'coordinador', 'analista', 'almacenista'].includes(rol)) {
            document.getElementById('btnVerRegistro').classList.remove('hidden');
        }

        let html5QrCode = null;

        function cerrarSesion() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace('/');
        }

        function parsearQR(textoQR) {
            const limpio = textoQR.trim().replace(/^"+|"+$/g, '');
            const campos = limpio.split('|');

            if (campos.length >= 11) {
                return {
                    codigo_qr: limpio,
                    codigo_articulo: campos[0]?.trim() || '',
                    descripcion: campos[1]?.trim() || 'PRODUCTO SIN DESCRIPCION',
                    lote: campos[2]?.trim() || '',
                    fecha_vencimiento: campos[3]?.trim() || '',
                    cantidad: parseInt(campos[4]?.trim()) || 1,
                    num_recibo: campos[5]?.trim() || '',
                    turno: campos[6]?.trim() || '',
                    grupo: campos[7]?.trim() || '',
                    fecha_recibo: campos[8]?.trim() || '',
                    fecha_contabilizacion: campos[9]?.trim() || '',
                    num_op: campos[10]?.trim() || ''
                };
            }
            return null;
        }

        function iniciarCamara() {
            if (html5QrCode && html5QrCode.isScanning) return;

            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                async (decodedText) => {
                    const datos = parsearQR(decodedText);
                    if (datos) {
                        document.getElementById('codigo_qr').value = datos.codigo_qr;
                        document.getElementById('codigo_articulo').value = datos.codigo_articulo;
                        document.getElementById('descripcion').value = datos.descripcion;
                        document.getElementById('lote').value = datos.lote;
                        document.getElementById('fecha_vencimiento').value = datos.fecha_vencimiento;
                        document.getElementById('cantidad').value = datos.cantidad;
                        document.getElementById('num_recibo').value = datos.num_recibo;
                        document.getElementById('turno').value = datos.turno;
                        document.getElementById('grupo').value = datos.grupo;
                        document.getElementById('fecha_recibo').value = datos.fecha_recibo;
                        document.getElementById('fecha_contabilizacion').value = datos.fecha_contabilizacion;
                        document.getElementById('num_op').value = datos.num_op;

                        const btn = document.getElementById('btnGuardar');
                        btn.disabled = false;

                        if (rol === 'almacenista') {
                            btn.innerText = "🔍 Conciliar Recepción en Almacén";
                            btn.className = "w-full bg-amber-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-amber-700 transition shadow-md flex items-center justify-center gap-1 mt-2 cursor-pointer";
                        } else {
                            btn.innerText = "✅ Registrar Salida de Producción";
                            btn.className = "w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-emerald-700 transition shadow-md flex items-center justify-center gap-1 mt-2 cursor-pointer";
                        }

                        detenerCamara();

                        if (rol === 'almacenista') {
                            await confirmarConciliacionAlmacen(datos);
                        } else {
                            Swal.fire({
                                icon: 'success',
                                title: '¡QR Lectura Correcta!',
                                text: `Ticket N° ${datos.num_recibo} procesado. OP: ${datos.num_op}`,
                                confirmButtonColor: '#2563eb'
                            });
                        }
                    } else {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Formato Inválido',
                            text: 'El código QR no contiene el formato esperado de 11 delimitadores (|).',
                            confirmButtonColor: '#2563eb'
                        });
                    }
                },
                (errorMessage) => { }
            ).then(() => {
                document.getElementById('btnStartCam').disabled = true;
                document.getElementById('btnStartCam').className = "flex-1 bg-gray-300 text-gray-500 py-2.5 rounded-xl font-bold text-xs cursor-not-allowed";
                document.getElementById('btnStopCam').disabled = false;
                document.getElementById('btnStopCam').className = "flex-1 bg-amber-600 text-white py-2.5 rounded-xl font-bold text-xs hover:bg-amber-700 transition cursor-pointer";
            }).catch(err => {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Cámara',
                    text: 'No se pudo acceder a la cámara trasera de este dispositivo.',
                    confirmButtonColor: '#ef4444'
                });
            });
        }

        function detenerCamara() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('btnStartCam').disabled = false;
                    document.getElementById('btnStartCam').className = "flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-xs hover:bg-blue-700 transition cursor-pointer";
                    document.getElementById('btnStopCam').disabled = true;
                    document.getElementById('btnStopCam').className = "flex-1 bg-gray-300 text-gray-600 py-2.5 rounded-xl font-bold text-xs cursor-not-allowed";
                });
            }
        }

        async function confirmarConciliacionAlmacen(datos) {
            const ticketNumero = typeof datos === 'object' ? datos.num_recibo : datos;

            await cargarUltimos();

            const ticketExistente = salidasCache.find(s => String(s.num_recibo).trim() === String(ticketNumero).trim());

            if (ticketExistente && (ticketExistente.recibido_almacen === true || ticketExistente.recibido_almacen === "true")) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Ticket Ya Conciliado',
                    text: `El ticket N° '${ticketNumero}' ya fue conciliado e ingresado al almacén previamente.`,
                    confirmButtonColor: '#d97706'
                });
                return;
            }

            Swal.fire({
                title: '¿Deseas conciliar este ticket?',
                html: `
                    <div class="text-left text-xs space-y-1 bg-gray-50 p-3 rounded-lg border my-2">
                        <p><strong>N° Ticket:</strong> ${ticketNumero}</p>
                        <p><strong>SKU:</strong> ${datos.codigo_articulo || 'N/A'}</p>
                        <p><strong>Descripción:</strong> ${datos.descripcion || 'N/A'}</p>
                        <p><strong>Cantidad:</strong> <span class="text-emerald-600 font-bold">${datos.cantidad || 1} und.</span></p>
                    </div>
                `,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#d97706',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Sí, Conciliar Recepción',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    ejecutarConciliacionAlmacen(ticketNumero);
                }
            });
        }

        async function procesarLectura(e) {
            e.preventDefault();
            const num_recibo = document.getElementById('num_recibo').value;

            if (!num_recibo) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Atención',
                    text: 'Por favor escanea un código QR antes de procesar.',
                    confirmButtonColor: '#2563eb'
                });
                return;
            }

            if (rol === 'almacenista') {
                await confirmarConciliacionAlmacen({
                    num_recibo: num_recibo,
                    codigo_articulo: document.getElementById('codigo_articulo').value,
                    descripcion: document.getElementById('descripcion').value,
                    cantidad: document.getElementById('cantidad').value
                });
            } else {
                guardarSalidaAnalista();
            }
        }

        async function guardarSalidaAnalista() {
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.innerText = "⏳ Guardando registro...";

            const payload = {
                codigo_qr: document.getElementById('codigo_qr').value,
                codigo_articulo: document.getElementById('codigo_articulo').value || null,
                descripcion: document.getElementById('descripcion').value || 'PRODUCTO',
                lote: document.getElementById('lote').value || null,
                fecha_vencimiento: document.getElementById('fecha_vencimiento').value || null,
                cantidad: parseInt(document.getElementById('cantidad').value) || 1,
                num_recibo: document.getElementById('num_recibo').value || null,
                turno: document.getElementById('turno').value || null,
                grupo: document.getElementById('grupo').value || null,
                fecha_recibo: document.getElementById('fecha_recibo').value || null,
                fecha_contabilizacion: document.getElementById('fecha_contabilizacion').value || null,
                num_op: document.getElementById('num_op').value || null
            };

            try {
                const response = await fetch('/api/salidas/registrar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    Swal.fire({
                        icon: 'success',
                        title: '¡Registrado por Producción!',
                        text: `Salida ID #${data.id} registrada en estado PENDIENTE por conciliar.`,
                        confirmButtonColor: '#059669'
                    });

                    document.getElementById('formSalida').reset();
                    btn.disabled = true;
                    btn.innerText = "✅ Registrar Salida de Producción";
                    btn.className = "w-full bg-gray-300 text-gray-500 py-3 rounded-xl font-bold text-xs transition shadow-sm cursor-not-allowed flex items-center justify-center gap-1 mt-2";

                    await cargarUltimos();
                } else {
                    const err = await response.json();
                    Swal.fire({
                        icon: 'error',
                        title: 'Atención',
                        text: err.detail || "Ocurrió un problema al procesar el registro.",
                        confirmButtonColor: '#ef4444'
                    });

                    btn.disabled = false;
                    btn.innerText = "✅ Registrar Salida de Producción";
                    btn.className = "w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-emerald-700 transition shadow-md flex items-center justify-center gap-1 mt-2 cursor-pointer";
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Conexión',
                    text: 'Comprueba tu red o servidor.',
                    confirmButtonColor: '#ef4444'
                });

                btn.disabled = false;
                btn.innerText = "✅ Registrar Salida de Producción";
                btn.className = "w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-emerald-700 transition shadow-md flex items-center justify-center gap-1 mt-2 cursor-pointer";
            }
        }

        async function ejecutarConciliacionAlmacen(numRecibo) {
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.innerText = "⏳ Conciliando en Almacén...";

            try {
                const response = await fetch('/api/salidas/conciliar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        num_recibo: String(numRecibo),
                        almacen_destino: "ALM01"
                    })
                });

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Conciliación Exitosa!',
                        text: `El ticket N° ${numRecibo} ha sido ingresado exitosamente al almacén.`,
                        confirmButtonColor: '#059669'
                    });

                    document.getElementById('formSalida').reset();
                    btn.disabled = true;
                    btn.innerText = "🔍 Conciliar Recepción en Almacén";
                    btn.className = "w-full bg-gray-300 text-gray-500 py-3 rounded-xl font-bold text-xs transition shadow-sm cursor-not-allowed flex items-center justify-center gap-1 mt-2";

                    await cargarUltimos();
                } else {
                    const err = await response.json();

                    Swal.fire({
                        icon: 'warning',
                        title: 'Atención',
                        text: err.detail || 'Operación denegada.',
                        confirmButtonColor: '#d97706'
                    });

                    btn.disabled = false;
                    btn.innerText = "🔍 Conciliar Recepción en Almacén";
                    btn.className = "w-full bg-amber-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-amber-700 transition shadow-md flex items-center justify-center gap-1 mt-2 cursor-pointer";
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Red',
                    text: 'No se pudo conectar con el servidor.',
                    confirmButtonColor: '#ef4444'
                });

                btn.disabled = false;
                btn.innerText = "🔍 Conciliar Recepción en Almacén";
                btn.className = "w-full bg-amber-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-amber-700 transition shadow-md flex items-center justify-center gap-1 mt-2 cursor-pointer";
            }
        }

        async function cargarUltimos() {
            try {
                const res = await fetch('/api/salidas/?page=1&limit=50', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const jsonRes = await res.json();
                    
                    if (Array.isArray(jsonRes)) {
                        salidasCache = jsonRes;
                    } else if (jsonRes && Array.isArray(jsonRes.data)) {
                        salidasCache = jsonRes.data;
                    } else {
                        salidasCache = [];
                    }

                    const div = document.getElementById('listaUltimos');
                    if (!salidasCache || salidasCache.length === 0) {
                        div.innerHTML = `<p class="text-center py-2">No hay registros de salidas en el sistema.</p>`;
                        return;
                    }

                    div.innerHTML = salidasCache.map(s => {
                        const estaConciliado = s.recibido_almacen === true || s.recibido_almacen === "true";
                        return `
                            <div class="p-2.5 bg-gray-50 rounded-xl border border-gray-100 flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-bold text-gray-800 block">${s.descripcion}</span>
                                    <span class="text-[10px] text-gray-500">Ticket: ${s.num_recibo || 'N/A'} | Fecha: ${s.fecha_hora || 'N/A'}</span>
                                </div>
                                <div>
                                    ${estaConciliado 
                                        ? `<span class="font-black text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-200">✅ Conciliado</span>`
                                        : `<span class="font-black text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⏳ Pendiente</span>`
                                    }
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) {
                console.error("Error al cargar últimos escaneos:", e);
            }
        }

        cargarUltimos();
    </script>
</body>
</html>
